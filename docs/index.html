<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Scorched Billionaire</title>
    <meta name="description" content="Scorched Billionaire — Billionaires battle rockets on the moon. A satirical 3D artillery game." />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { display: block; width: 100%; height: 100%; }
      #ui-layer {
        position: fixed; inset: 0; z-index: 10; pointer-events: none;
      }
      #ui-layer > * { pointer-events: auto; }
      #loading {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #000; color: #ddd;
        font-family: "Consolas", "Courier New", monospace; user-select: none;
      }
      #loading h1 {
        margin: 0 0 6px; font-size: 44px; letter-spacing: 5px; color: #fff;
        text-shadow: 3px 3px 0 #b25a00;
      }
      #loading .sub { color: #e08bb0; margin-bottom: 28px; font-size: 18px; }
      #loading .bar {
        width: 340px; height: 16px; border: 1px solid #666; background: #141414; overflow: hidden;
      }
      #loading .bar > i {
        display: block; width: 0%; height: 100%;
        background: linear-gradient(90deg, #7a3b00, #d6892f);
        transition: width .25s ease-out;
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: .55; } }
      #loading .pct { margin-top: 10px; font-size: 13px; color: #9a9a9a; }
      #loading.done { display: none; }
    </style>
    <script type="module" crossorigin src="./assets/main-CFA7AwLC.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui-layer"></div>
    <div id="loading">
      <h1>SCORCHED BILLIONAIRE</h1>
      <div class="sub">The Mother of All VC Rounds</div>
      <div class="bar"><i id="loading-bar"></i></div>
      <div class="pct" id="loading-pct">Loading&hellip;</div>
    </div>
  </body>
</html>
